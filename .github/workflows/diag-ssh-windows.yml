name: Diagnose ssh -G on Windows

# Throwaway. TestResolveJumpHostsUsesConfiguredAliasesAndSSHConfig fails on
# windows-latest with `ssh -G "bastion": exit status 1` after 15.50s — the same
# 15s the SSHConfigSource gives the command, so the process was killed, not
# refused. The identical command answers in ~70ms on a maintainer's Windows box.
#
# The question this run answers is which of three things is true: the ssh binary
# the runner resolves, the runner's ambient SSH configuration, or the config the
# test writes. Nothing here changes product behaviour — a timeout must not be
# read as "OpenSSH unavailable" until there is evidence some class of it safely
# can be, because a silent fallback to the embedded parser is exactly the path
# that could resolve an alias to a different host than the user's own ssh would.
# workflow_dispatch would need this file on the default branch to be
# dispatchable, and it only exists on studio; a path-scoped push runs it here
# without putting a throwaway probe in front of main-v2.
on:
  workflow_dispatch:
  push:
    branches: [studio]
    paths: ['.github/workflows/diag-ssh-windows.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 1. Which ssh is on PATH, and what is it.
      - name: Which ssh
        shell: pwsh
        run: |
          Write-Host "--- Get-Command ssh -All ---"
          Get-Command ssh -All -ErrorAction SilentlyContinue |
            Format-Table -AutoSize Name, CommandType, Version, Source | Out-String -Width 200
          Write-Host "--- where.exe ssh ---"
          & where.exe ssh 2>&1 | Out-String
          Write-Host "--- ssh -V ---"
          & ssh -V 2>&1 | Out-String

      # 4. Where OpenSSH would look for ambient configuration.
      - name: Environment OpenSSH reads
        shell: pwsh
        run: |
          foreach ($n in 'HOME', 'USERPROFILE', 'HOMEDRIVE', 'HOMEPATH') {
            Write-Host ("{0,-12} = {1}" -f $n, [Environment]::GetEnvironmentVariable($n))
          }
          foreach ($p in "$env:USERPROFILE\.ssh\config", "$env:HOME\.ssh\config",
                         "$env:ProgramData\ssh\ssh_config") {
            Write-Host ("exists {0,-6} {1}" -f (Test-Path $p), $p)
            if (Test-Path $p) { Write-Host "--- contents ---"; Get-Content $p | Out-String }
          }

      # 2. An empty config isolates the binary from ambient configuration: a
      #    fast answer here puts the cause in the config, a hang puts it in the
      #    binary or its runtime.
      - name: ssh -G with an empty config
        shell: pwsh
        run: |
          $empty = Join-Path $env:RUNNER_TEMP "empty_ssh_config"
          New-Item -ItemType File -Path $empty -Force | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath ssh -ArgumentList '-G','-F',$empty,'--','example.invalid' `
                 -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\e.out" `
                 -RedirectStandardError "$env:RUNNER_TEMP\e.err"
          if (-not $p.WaitForExit(20000)) { $p.Kill(); Write-Host "::warning::empty-config probe still running at 20s; killed" }
          $sw.Stop()
          Write-Host ("elapsed = {0} ms   exit = {1}" -f $sw.ElapsedMilliseconds, $p.ExitCode)
          Write-Host "--- stdout (first 20) ---"; Get-Content "$env:RUNNER_TEMP\e.out" -TotalCount 20 | Out-String
          Write-Host "--- stderr ---";            Get-Content "$env:RUNNER_TEMP\e.err" | Out-String

      # 3. The config the test actually writes, with -vvv so a hang says where
      #    it stopped. Same alias and same file shape as jump_resolve_test.go.
      - name: ssh -G with the test's own config, verbose
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "sshcfg"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $cfg = Join-Path $dir "config"
          Set-Content -Path $cfg -NoNewline -Value "Host bastion`n  HostName 10.0.0.8`n  User jump-user`n  Port 2202`n  IdentityFile ~/.ssh/jump_key`n"
          Write-Host "--- config written ---"; Get-Content $cfg | Out-String
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath ssh -ArgumentList '-vvv','-G','-F',$cfg,'--','bastion' `
                 -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\t.out" `
                 -RedirectStandardError "$env:RUNNER_TEMP\t.err"
          $finished = $p.WaitForExit(20000)
          $sw.Stop()
          if (-not $finished) { $p.Kill(); Write-Host "::warning::test-config probe still running at 20s; killed — this is the hang" }
          # 5. Elapsed and how it ended, so a 15s kill is told from a refusal.
          Write-Host ("elapsed = {0} ms   finished = {1}   exit = {2}" -f $sw.ElapsedMilliseconds, $finished, $(if ($finished) { $p.ExitCode } else { "killed" }))
          Write-Host "--- stdout (first 30) ---"; Get-Content "$env:RUNNER_TEMP\t.out" -TotalCount 30 | Out-String
          Write-Host "--- stderr, last 60 lines: where it stopped ---"
          Get-Content "$env:RUNNER_TEMP\t.err" -Tail 60 | Out-String

      # The failing test itself, so its own timing is on the same page.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: The test as CI runs it
        shell: pwsh
        run: go test -count=1 -run TestResolveJumpHostsUsesConfiguredAliasesAndSSHConfig -v ./internal/remote/
