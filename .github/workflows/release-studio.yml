name: Release Studio
run-name: Release Studio ${{ inputs.tag || github.ref_name }}

# The only release line this branch publishes. It has its own tag namespace
# (studio-v*), its own environment gate, and its own rollback catalog at
# dl.reasonix.io/studio/versions.json.
#
# What it must never touch: the repository-wide "latest" release (every Studio
# release is a prerelease) and the root dl.reasonix.io/versions.json, which is
# the desktop line's catalog. Studio artifacts land under the tag prefix, which
# cannot collide because the tag name itself differs.
#
# Windows artifacts are Authenticode-signed through SignPath in two stages: the
# executable a user runs, then the installer built around it. Signing only the
# container leaves reasonix-studio.exe unsigned on disk after installation,
# which is what reputation heuristics quarantine. Signing engages only when
# SIGNPATH_API_TOKEN is set, so forks and token-less runs still build unsigned.
on:
  push:
    tags: ['studio-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing studio tag to recover (for example studio-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write # create the release and upload artifacts

concurrency:
  group: release-studio-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve Studio release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: release
        env:
          IN_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${IN_TAG:-$REF_NAME}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ ^studio-v(.+)$ ]] || [[ ! "${BASH_REMATCH[1]}" =~ $semver ]]; then
            echo "::error::studio release tag must be studio-vMAJOR.MINOR.PATCH[-PRERELEASE], got: $tag"
            exit 1
          fi
          # A dispatch recovers an existing tag; it must not invent one.
          sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          # The tag has to be on the studio line. Publishing a main-v2 commit
          # from here would produce a Studio build without Studio in it.
          if ! git merge-base --is-ancestor "$sha" origin/studio; then
            echo "::error::$tag is not on studio history"
            exit 1
          fi
          version="${tag#studio-}"
          { echo "tag=$tag"; echo "version=$version"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          echo "resolved $tag -> $version at $sha"

  # The contract is this repository's mirror of what SignPath's console trusts:
  # which branch and which workflow may request the release certificate. It is
  # checked before anything is built so a widened origin fails here rather than
  # at the signing request, and fingerprinted so the protected files cannot move
  # under an attestation that was recorded against different bytes.
  signing-contract:
    name: validate SignPath release contract
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate and fingerprint the contract
        run: |
          go run ./cmd/signpath-contract validate
          echo "fingerprint=$(go run ./cmd/signpath-contract fingerprint)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.platform }})
    needs: [resolve, signing-contract]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read # SignPath reads run details and downloads the unsigned artifact
    env:
      # Two conditions, because they answer different questions. The token says
      # a fork cannot try — that is the APPLE_* gate's shape. The variable says
      # SignPath's console has been told to trust this line's origin, which no
      # secret can express: SIGNPATH_API_TOKEN is a repository secret, so it is
      # already set here, and without the second gate merging this file would
      # make the next release request a signature the policy still refuses.
      # Set STUDIO_SIGNING_ENABLED=true once the studio origin is provisioned.
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.STUDIO_SIGNING_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows/amd64
            runner: windows-latest
          - platform: darwin/universal
            runner: macos-latest
          - platform: linux/amd64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/frontend-next/pnpm-lock.yaml

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      # nfpm builds the .deb without dpkg-deb. Pinned to the version the desktop
      # line uses, so both packages are produced by one packager.
      - name: Install nfpm
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      # Same pinned, checksum-verified NSIS the desktop line installs.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/install-nsis.ps1

      # The same Developer ID and notary credentials the desktop line uses: one
      # certificate signs any bundle identifier its team owns, so Studio does not
      # need a second one. studio-build.sh reads the keychain rather than a flag,
      # and ad-hoc signs when it finds no identity — which is what shipped before
      # this step existed, and what Gatekeeper refuses to open.
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "APPLE_CERT_P12 unset — Studio will ad-hoc sign (un-notarized)"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          # Prepend the signing keychain to the search list so codesign / find-identity see it.
          existing_keychains=()
          while IFS= read -r keychain; do
            [ -n "$keychain" ] && existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN" "${existing_keychains[@]}"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          rm -f "$RUNNER_TEMP/cert.p12"

      # Studio declares SelfUpdate: true, which promises a replacement bundle
      # Gatekeeper still opens. An official build that reached the users without
      # a Developer ID would break the next update rather than the first launch,
      # so this fails closed the way the desktop line's Authenticode gate does.
      - name: Require Apple signing
        if: runner.os == 'macOS' && github.repository == 'esengine/DeepSeek-Reasonix'
        env:
          HAS_APPLE: ${{ secrets.APPLE_CERT_P12 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
        run: |
          if [ "$HAS_APPLE" != "true" ]; then
            echo "::error::all five APPLE_* secrets are required to publish Studio for macOS"
            exit 1
          fi

      - name: Build
        shell: bash
        env:
          # studio-build.sh notarizes only when all three are present; the cert
          # itself is found through the keychain staged above.
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # Windows splits so a signature can be taken between the executable
          # and the packages built around it; every other platform is one shot.
          if [ "${{ runner.os }}" = "Windows" ]; then
            bash scripts/studio-build.sh --windows-payload amd64 "${{ needs.resolve.outputs.version }}"
          else
            bash scripts/studio-build.sh "${{ matrix.platform }}" "${{ needs.resolve.outputs.version }}"
          fi

      # Stage one: the executable a user actually runs, signed while it is still
      # a loose file. MicrosoftEdgeWebview2Setup.exe is fetched by the packaging
      # stage, after this — it is Microsoft's and already signed, and this
      # request must not re-sign somebody else's binary.
      - name: Upload unsigned Windows payload for SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: unsigned-payload
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-studio-payload-amd64
          path: dist/windows-payload-amd64/reasonix-studio.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit Windows payload for Authenticode signing
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: submit-payload
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: DeepSeek-Reasonix
          signing-policy-slug: release-signing
          artifact-configuration-slug: studio-windows-payload
          github-artifact-id: ${{ steps.unsigned-payload.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: false

      # The release certificate requires an approval per request. The publish
      # job's environment gate is the human one; the SignPath CI identity records
      # the request approval so this does not become a second prompt.
      - name: Approve and download signed payload
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          ./scripts/complete-signpath-request.ps1 `
            -OrganizationId "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" `
            -SigningRequestId "${{ steps.submit-payload.outputs.signing-request-id }}" `
            -ExpectedSigningPolicySlug "release-signing" `
            -OutputArtifactDirectory "signed-payload" `
            -TimeoutSeconds 1800

      - name: Put the signed executable back in the payload
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        shell: bash
        run: cp signed-payload/reasonix-studio.exe dist/windows-payload-amd64/reasonix-studio.exe

      - name: Package Windows from the payload
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/studio-build.sh --windows-package amd64 "${{ needs.resolve.outputs.version }}"

      # Stage two: the finished NSIS container, signed only once the payload it
      # was built from is present and already signed — the artifact
      # configuration verifies that rather than trusting this job's ordering.
      - name: Upload unsigned installer for SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: unsigned-installer
        shell: bash
        run: |
          mkdir -p installer-bundle
          cp dist/ReasonixStudio-windows-amd64-installer.exe installer-bundle/
          cp dist/windows-payload-amd64/reasonix-studio.exe installer-bundle/

      - name: Upload installer bundle
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: installer-artifact
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-studio-installer-amd64
          path: installer-bundle/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit installer for Authenticode signing
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: submit-installer
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: DeepSeek-Reasonix
          signing-policy-slug: release-signing
          artifact-configuration-slug: studio-windows-installer
          github-artifact-id: ${{ steps.installer-artifact.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: false

      - name: Approve and download signed installer
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          ./scripts/complete-signpath-request.ps1 `
            -OrganizationId "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" `
            -SigningRequestId "${{ steps.submit-installer.outputs.signing-request-id }}" `
            -ExpectedSigningPolicySlug "release-signing" `
            -OutputArtifactDirectory "signed-installer" `
            -TimeoutSeconds 1800

      - name: Replace the installer with the signed build
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        shell: bash
        run: cp signed-installer/*installer*.exe dist/

      # Both stages are read back off the artifacts that will actually ship. A
      # signature this job believes it applied but that is not on the bytes in
      # dist/ is the one failure the two requests above cannot catch themselves.
      - name: Verify the Windows Authenticode chain
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          ./scripts/verify-windows-authenticode.ps1 `
            -PayloadDirectory signed-payload `
            -InstallerPath "dist/ReasonixStudio-windows-amd64-installer.exe"

      - uses: actions/upload-artifact@v5
        with:
          name: studio-${{ strategy.job-index }}
          path: dist/ReasonixStudio-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: sign, publish and mirror
    needs: [resolve, build]
    runs-on: ubuntu-latest
    # Owner approval for the whole line. The gate sits here rather than before
    # build so the approval is given with the artifacts already proven to build.
    environment: studio-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: actions/download-artifact@v6
        with:
          path: staging
          merge-multiple: true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find staging -type f -name 'ReasonixStudio-*' -exec mv {} dist/ \;
          ls -la dist
          # Three portable archives, the Linux .deb and the Windows installer.
          # Fewer means an artifact was lost between jobs, and a partial release
          # is worse than a failed one.
          count=$(find dist -type f -name 'ReasonixStudio-*' | wc -l)
          if [ "$count" -lt 5 ]; then
            echo "::error::expected 5 artifacts (3 portable + Linux .deb + Windows installer), found $count"
            exit 1
          fi
          # These two are how a user installs rather than unzips, and the .deb is
          # also the Linux self-update channel — missing either degrades the
          # release silently instead of failing it.
          for required in 'ReasonixStudio-linux-*.deb' 'ReasonixStudio-windows-*-installer.exe'; do
            find dist -type f -name "$required" | grep -q . || {
              echo "::error::no $required in the release; its packager did not run"
              exit 1
            }
          done

      # The same minisign key the desktop line uses, because the public key that
      # verifies it is compiled into the client (update.PublicKey).
      - name: Sign
        working-directory: desktop
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          go run ./cmd/sign sign ../dist/*
          for f in ../dist/ReasonixStudio-*; do
            case "$f" in *.minisig) continue ;; esac
            go run ./cmd/sign verify "$f"
          done

      - name: Generate manifest
        working-directory: desktop
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run ./cmd/studio-manifest ../dist "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.tag }}"

      # Always a prerelease: this line is not the public product line, and
      # GitHub never promotes a prerelease to the repository-wide "latest".
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # A version's own notes live in release-notes/studio/<semver>.md, named
          # without the v the tag carries. The release still publishes without
          # one, carrying only the standing text.
          version_notes="release-notes/studio/${VERSION#v}.md"
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"
          if [ -f "$version_notes" ]; then
            cat "$version_notes" >> "$notes"
            printf '\n' >> "$notes"
          else
            echo "::warning::no $version_notes; publishing the standing text only"
          fi
          cat >> "$notes" <<'BODY'
          ---

          **macOS** 已用 Developer ID 签名并公证，打开时不需要清除隔离属性。**Windows 包未签名** —— Authenticode 签名绑定在受保护的 `main-v2` 上，本分支拿不到它，所以 SmartScreen 会告警：选「更多信息」，再选「仍要运行」。**Linux** 从 `.deb` 安装。

          三个平台都能自更新：Linux 走自己的包，Windows 运行下一个安装器，macOS 替换自身 bundle。
          BODY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Reasonix Studio $VERSION" \
              --notes-file "$notes" \
              --prerelease \
              --latest=false
          fi

      - name: Mirror to R2 and update the Studio catalog
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_ACCOUNT_ID != '' && secrets.R2_BUCKET != '' }}
        run: |
          if [ "$HAS_R2" != "true" ]; then
            echo "::warning::R2 credentials are not configured; the GitHub release is published but the Studio catalog was not updated, so running builds will not see this version"
            exit 0
          fi
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set default.region auto
          endpoint="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

          # Immutable per-tag objects. The tag prefix cannot collide with the
          # desktop line's because the tag names differ (studio-v* vs desktop-v*).
          aws s3 cp dist/ "s3://${R2_BUCKET}/${TAG}/" --recursive --endpoint-url "$endpoint"

          # Studio's own catalog. Writing the ROOT versions.json here would hand
          # desktop users Studio releases, so the prefix is not optional.
          current=/tmp/studio-versions-current.json
          next=/tmp/studio-versions-next.json
          source=-
          if aws s3 cp "s3://${R2_BUCKET}/studio/versions.json" "$current" --endpoint-url "$endpoint" 2>/dev/null; then
            source="$current"
          else
            echo "no existing Studio catalog; starting a new one"
          fi
          bash scripts/update-versions-index.sh "$source" "$VERSION" "$TAG" studio \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$next"
          jq -e --arg v "$VERSION" '.versions | map(select(.version == $v)) | length == 1' "$next" >/dev/null
          aws s3 cp "$next" "s3://${R2_BUCKET}/studio/versions.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300, stale-if-error=86400"
          echo "Studio catalog -> $VERSION"
