prompt = """Answer using the fleet tool with exactly three items, and do not read any project files yourself.

Item one: id "scan", read_only true. Prompt it to list every module file under svc/, submitting those files as the subjects to map over.

Item two: id "derive", for_each "scan", read_only true, max_items 10. Prompt it to read the single module file it is given, derive that module's effective timeout from the constants it declares, and report the module name with its effective value and nothing else.

Item three: id "report", depends_on ["derive"], write_paths ["ANSWER.md"]. Prompt it to write ANSWER.md in the workspace root with exactly two lines, `module=<name>` then `effective=<N>`, naming the one module whose effective timeout is above the contract's cap of 30."""
class = "delegation"
timeout_sec = 900
